name: CI/CD Build & Deploy

on:
  push:
    branches:
      - develop
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'Dockerfile'
      - '.github/workflows/ci-cd-develop.yml'

env:
  IMAGE_NAME: davidvothe/appointment

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: dotnet test --no-build --verbosity normal

    - name: Publish project
      run: dotnet publish -c Release -o out

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & Push Docker image
      run: |
        docker build -t $IMAGE_NAME:develop-${{ github.sha }} .
        docker tag $IMAGE_NAME:develop-${{ github.sha }} $IMAGE_NAME:develop-latest
        docker push $IMAGE_NAME:develop-${{ github.sha }}
        docker push $IMAGE_NAME:develop-latest

    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          docker pull $IMAGE_NAME:develop-latest
          docker stop backend || true
          docker rm backend || true
          docker run -d --name backend -p 80:80 $IMAGE_NAME:develop-latest
